openapi: 3.0.3
info:
  title: Interview Practice AI API
  description: >
    Đặc tả API cho hệ thống luyện phỏng vấn xin việc tích hợp AI (STT + LLM chấm điểm + TTS phản hồi).
    Viết dựa trên Design Class Diagram và Sequence Diagram trong docs/diagrams/, đối chiếu business rule trong
    docs/business/Dac_Ta_Use_Case.docx và rubric chấm điểm trong docs/business/Rubric_Cham_Diem.md.
    Bản 0.2.0: chấm điểm bất đồng bộ (202 + polling), rubric đa chiều theo loại câu hỏi, đặt lại mật khẩu,
    phân trang, response lỗi chuẩn. Backend (Spring Boot) chưa được implement — spec này là nguồn tham chiếu để build controller/service/entity.
  version: 0.2.0
servers:
  - url: /api
    description: Base path tương đối; domain chính thức chốt khi triển khai trên Render

tags:
  - name: Auth
    description: Đăng ký, đăng nhập, quên và đặt lại mật khẩu (UC1, UC2)
  - name: Questions
    description: Xem và lọc câu hỏi phỏng vấn (UC3)
  - name: Practice
    description: Ghi âm, nộp câu trả lời, chấm điểm AI bất đồng bộ và chấm lại (UC4, UC5)
  - name: Feedback
    description: Nghe phản hồi AI bằng giọng nói (UC6)
  - name: History
    description: Lịch sử luyện tập (UC7)
  - name: Admin - Questions
    description: Quản lý ngân hàng câu hỏi (UC8, role ADMIN)
  - name: Admin - Analytics
    description: Theo dõi hoạt động người dùng (UC9, role ADMIN)

security:
  - bearerAuth: []

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Đăng ký tài khoản (UC1)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Tạo tài khoản thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          description: Dữ liệu không hợp lệ (B1 email không đúng RFC 5322, B2 mật khẩu < 8 ký tự, confirmPassword không khớp)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email đã tồn tại (B4)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags: [Auth]
      summary: Đăng nhập (UC2)
      description: >
        Trả JWT có hạn 24h (jwt.expiration-hours=24). Sau 5 lần sai liên tiếp, tài khoản bị khoá tạm thời
        (B1: lock/CAPTCHA) — LoginAttemptService.isBlocked/increaseFailCount/resetFailCount.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Sai email hoặc mật khẩu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Tài khoản tạm khoá do đăng nhập sai quá 5 lần (code ACCOUNT_LOCKED); tự mở khoá sau thời gian khoá (15 phút)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Yêu cầu đặt lại mật khẩu (gửi email)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Đã tiếp nhận yêu cầu (nếu email tồn tại, email hướng dẫn được gửi đi)
        '400':
          description: Email không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

      description: >
        Luôn trả 200 dù email có tồn tại hay không để không lộ danh sách tài khoản. Nếu email tồn tại, hệ thống tạo token dùng một lần
        (lưu bản băm SHA-256) và gửi link đặt lại mật khẩu qua MailService.
  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Đặt lại mật khẩu bằng token trong email
      description: >
        Token gửi qua email, chỉ dùng một lần và có thời hạn 30 phút. Sau khi đặt lại thành công,
        failed_login_count về 0 và tài khoản được mở khoá.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Đặt lại mật khẩu thành công
        '400':
          description: Token không hợp lệ, đã dùng hoặc hết hạn (code INVALID_TOKEN), hoặc mật khẩu mới không hợp lệ (VALIDATION_ERROR)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /questions:
    get:
      tags: [Questions]
      summary: Danh sách câu hỏi theo bộ lọc (UC3)
      description: Chỉ trả về câu hỏi có status=ACTIVE (B1), có phân trang. Dùng /questions/random để lấy ngẫu nhiên một câu.
      parameters:
        - name: industry
          in: query
          schema:
            type: string
        - name: position
          in: query
          schema:
            type: string
        - name: level
          in: query
          schema:
            $ref: '#/components/schemas/QuestionLevel'
        - name: questionType
          in: query
          schema:
            $ref: '#/components/schemas/QuestionType'
        - name: keyword
          in: query
          description: Từ khoá tìm trong nội dung câu hỏi
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Trang câu hỏi phù hợp bộ lọc
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /questions/random:
    get:
      tags: [Questions]
      summary: Lấy ngẫu nhiên một câu hỏi theo bộ lọc (UC3, Alt 5a)
      parameters:
        - name: industry
          in: query
          schema:
            type: string
        - name: position
          in: query
          schema:
            type: string
        - name: level
          in: query
          schema:
            $ref: '#/components/schemas/QuestionLevel'
      responses:
        '200':
          description: Một câu hỏi ACTIVE ngẫu nhiên
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Question'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Không có câu hỏi phù hợp
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /questions/{id}:
    get:
      tags: [Questions]
      summary: Chi tiết một câu hỏi
      parameters:
        - $ref: '#/components/parameters/QuestionId'
      responses:
        '200':
          description: Chi tiết câu hỏi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Question'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Không tìm thấy câu hỏi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /practice-sessions:
    post:
      tags: [Practice]
      summary: Tạo phiên luyện tập với câu hỏi đã chọn (UC3 → UC4)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '201':
          description: Phiên luyện tập được tạo, status=CREATED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PracticeSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Câu hỏi không tồn tại hoặc không còn ACTIVE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /practice-sessions/{id}:
    get:
      tags: [Practice]
      summary: Xem chi tiết một phiên luyện tập
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Chi tiết phiên luyện tập
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PracticeSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Không phải chủ sở hữu phiên luyện tập
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Không tìm thấy phiên luyện tập
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

      description: 'Dùng để polling trạng thái chấm điểm (mỗi 2 giây) sau khi gọi /evaluate hoặc /rescore: PROCESSING → SCORED hoặc FAILED (kèm errorCode).'
  /practice-sessions/{id}/answer:
    post:
      tags: [Practice]
      summary: Nộp file ghi âm câu trả lời (UC4)
      description: >
        Giới hạn thời lượng ghi âm 10 giây – 3 phút (B1), cảnh báo và tự dừng khi còn 30 giây (B2).
        Sau khi upload thành công, status chuyển UPLOADED và có thể gọi tiếp /evaluate.
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio]
              properties:
                audio:
                  type: string
                  format: binary
                durationSeconds:
                  type: integer
      responses:
        '200':
          description: Upload thành công, session chuyển sang UPLOADED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PracticeSession'
        '400':
          description: File audio không hợp lệ hoặc ngoài khoảng 10s–180s
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Không tìm thấy phiên luyện tập
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /practice-sessions/{id}/evaluate:
    post:
      tags: [Practice]
      summary: Bắt đầu chấm điểm câu trả lời bằng AI (UC5, bất đồng bộ)
      description: >
        Chuyển session sang PROCESSING, giao việc cho EvaluationExecutor rồi trả 202 ngay (≤ 1 giây). Worker thực hiện STT
        (timeout 15s, tự retry 1 lần), tính Delivery (WPM, từ đệm), gọi LLM ĐÚNG 1 LẦN (B4) với temperature thấp để chấm từng tiêu chí
        của rubric theo questionType kèm trích dẫn nguyên văn, kiểm tra trích dẫn rồi tự tính điểm tổng (xem docs/business/Rubric_Cham_Diem.md).
        Nếu LLM timeout/lỗi hoặc kết quả không hợp lệ, worker tự gọi lại đúng 1 lần; vẫn lỗi thì session chuyển FAILED kèm errorCode
        và người dùng có thể gọi lại endpoint này. Câu trả lời dưới 15 từ cũng chuyển FAILED với errorCode ANSWER_TOO_SHORT.
        Client polling GET /practice-sessions/{id} tới SCORED/FAILED rồi gọi GET /practice-sessions/{id}/result.
        NF1: từ lúc nộp audio đến khi SCORED ≤ 12 giây (đo trên 14 mẫu audio 10–131 giây).
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '202':
          description: Đã tiếp nhận, session chuyển sang PROCESSING
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PracticeSession'
              example:
                id: 7e0f1a30-4a4e-4c0b-b6d2-1a2b3c4d5e6f
                status: PROCESSING
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Không tìm thấy phiên luyện tập
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Session chưa có audio (status != UPLOADED/FAILED) hoặc đang PROCESSING (code SESSION_PROCESSING)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /practice-sessions/{id}/result:
    get:
      tags: [Practice]
      summary: Lấy kết quả chấm điểm (sau khi session SCORED)
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Kết quả chấm điểm theo rubric (điểm tổng, điểm từng tiêu chí, Delivery, nhận xét)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoreResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Không phải chủ sở hữu phiên luyện tập
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Không tìm thấy phiên luyện tập
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Chưa có kết quả vì session chưa SCORED (code SESSION_NOT_READY)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /practice-sessions/{id}/rescore:
    post:
      tags: [Practice]
      summary: Chấm lại với transcript đã sửa (UC5, Alt 6a, bất đồng bộ)
      description: >
        Dùng khi STT nhận sai. Không gọi lại STT: hệ thống tính lại Delivery từ transcript đã sửa, gọi LLM 1 lần rồi ghi đè kết quả cũ.
        Trả 202 và polling như /evaluate.
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RescoreRequest'
      responses:
        '202':
          description: Đã tiếp nhận, session chuyển sang PROCESSING
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PracticeSession'
        '400':
          description: Transcript dưới 15 từ (code ANSWER_TOO_SHORT) hoặc không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Không phải chủ sở hữu phiên luyện tập
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Không tìm thấy phiên luyện tập
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Session đang PROCESSING hoặc chưa từng được chấm (code SESSION_PROCESSING / SESSION_NOT_READY)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /practice-sessions/{id}/feedback/audio:
    get:
      tags: [Feedback]
      summary: Lấy audio TTS đọc phản hồi AI (UC6)
      description: Giới hạn tối đa 1000 ký tự mỗi lần đọc (FeedbackService.normalizeText maxLength=1000), giọng vi-VN.
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: URL audio phản hồi TTS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackAudioResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Không tìm thấy phiên luyện tập hoặc chưa có feedback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Lỗi kết nối dịch vụ TTS (giữ nguyên feedback dạng text)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /history:
    get:
      tags: [History]
      summary: Danh sách lịch sử luyện tập của chính người dùng (UC7)
      description: B1 — chỉ xem lịch sử của chính mình. B2 — dữ liệu lưu tối thiểu 6 tháng. Lọc theo thời gian, ngành nghề, mức điểm (UC7).
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: industry
          in: query
          schema:
            type: string
        - name: minScore
          in: query
          schema:
            type: number
            minimum: 0
            maximum: 100
        - name: maxScore
          in: query
          schema:
            type: number
            minimum: 0
            maximum: 100
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Trang phiên luyện tập đã hoàn thành (SCORED), mới nhất trước
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /history/{id}:
    get:
      tags: [History]
      summary: Chi tiết một mục lịch sử, kèm link phát lại audio
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: >
            Chi tiết phiên luyện tập + điểm số. Nếu file audio gốc đã hết hạn/không còn,
            vẫn trả transcript/điểm số, playbackUrl sẽ null.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Không phải chủ sở hữu phiên luyện tập
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Không tìm thấy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/questions:
    get:
      tags: [Admin - Questions]
      summary: Danh sách toàn bộ câu hỏi (bao gồm HIDDEN) — chỉ ADMIN
      security:
        - bearerAuth: [ADMIN]
      responses:
        '200':
          description: Trang câu hỏi (kể cả HIDDEN)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Không có quyền ADMIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/QuestionStatus'
        - name: keyword
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
    post:
      tags: [Admin - Questions]
      summary: Thêm câu hỏi mới — chỉ ADMIN (UC8)
      security:
        - bearerAuth: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionUpsertRequest'
      responses:
        '201':
          description: Tạo thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Question'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Không có quyền ADMIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '409':
          description: Nội dung trùng 100% với câu hỏi khác cùng vị trí (B2)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/questions/{id}:
    put:
      tags: [Admin - Questions]
      summary: Sửa câu hỏi — chỉ ADMIN
      security:
        - bearerAuth: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/QuestionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionUpsertRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Question'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Không có quyền ADMIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Không tìm thấy câu hỏi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Admin - Questions]
      summary: Xoá câu hỏi — chỉ ADMIN
      description: >
        Nếu câu hỏi đã từng được dùng trong ít nhất một PracticeSession → xoá mềm (status=HIDDEN).
        Nếu chưa từng dùng → xoá cứng khỏi DB. Mọi thao tác đều ghi AuditLog (NF2).
      security:
        - bearerAuth: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/QuestionId'
      responses:
        '204':
          description: Xoá (cứng hoặc mềm) thành công
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Không có quyền ADMIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '404':
          description: Không tìm thấy câu hỏi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/analytics/overview:
    get:
      tags: [Admin - Analytics]
      summary: Dashboard tổng quan hoạt động người dùng — chỉ ADMIN (UC9)
      description: B2 — không truy cập được mật khẩu/thông tin nhạy cảm của user.
      security:
        - bearerAuth: [ADMIN]
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Số liệu tổng quan (số user, số phiên luyện tập, số lượt gọi AI API...)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsOverview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Không có quyền ADMIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/analytics/users/{userId}:
    get:
      tags: [Admin - Analytics]
      summary: Chi tiết hoạt động của một người dùng — chỉ ADMIN
      security:
        - bearerAuth: [ADMIN]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Chi tiết hoạt động luyện tập của người dùng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserActivity'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Không có quyền ADMIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '404':
          description: Không tìm thấy user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/analytics/export:
    get:
      tags: [Admin - Analytics]
      summary: Xuất báo cáo hoạt động dạng Excel/CSV — chỉ ADMIN
      security:
        - bearerAuth: [ADMIN]
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [csv, xlsx]
            default: csv
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: File báo cáo
          content:
            text/csv:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Không có quyền ADMIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT trả về từ /auth/login, hạn dùng 24h.

  responses:
    Unauthorized:
      description: Thiếu hoặc sai JWT, hoặc JWT đã hết hạn (code UNAUTHORIZED)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: Dữ liệu gửi lên không hợp lệ (code VALIDATION_ERROR), chi tiết theo từng trường trong fieldErrors
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  parameters:
    SessionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    QuestionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    Page:
      name: page
      in: query
      description: Số trang, bắt đầu từ 0
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: Số phần tử mỗi trang
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  schemas:
    Role:
      type: string
      enum: [CANDIDATE, ADMIN]
    UserStatus:
      type: string
      enum: [ACTIVE, LOCKED]
    QuestionLevel:
      type: string
      enum: [EASY, MEDIUM, HARD]
    QuestionType:
      type: string
      enum: [BEHAVIORAL, SITUATIONAL, TECHNICAL, INTRO]
      description: Quyết định bộ tiêu chí và trọng số chấm điểm (xem Rubric_Cham_Diem.md)
    CriterionCode:
      type: string
      enum: [RELEVANCE, STRUCTURE, DEPTH, CORRECTNESS]
    CriterionScore:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/CriterionCode'
        score:
          type: integer
          minimum: 1
          maximum: 5
        weight:
          type: integer
          description: Trọng số của tiêu chí trong totalScore (tổng các tiêu chí + Delivery = 100)
        reasoning:
          type: string
        quote:
          type: string
          nullable: true
          description: Trích dẫn nguyên văn từ transcript làm bằng chứng
        quoteInvalid:
          type: boolean
          description: true nếu trích dẫn không khớp transcript và điểm đã bị hạ
    DeliveryMetrics:
      type: object
      nullable: true
      description: Null khi transcript dưới 30 từ hoặc thiếu thời lượng; khi đó trọng số Delivery chia lại cho các tiêu chí còn lại
      properties:
        wpm:
          type: integer
          description: Tốc độ nói (từ/phút), chấm theo dải (xem Rubric_Cham_Diem.md mục 5)
        fillerCount:
          type: integer
        fillerRate:
          type: number
          format: float
          description: Số từ đệm trên 100 từ
        deliveryScore:
          type: number
          format: float
          minimum: 1
          maximum: 5
        fillerListVersion:
          type: string
    QuestionStatus:
      type: string
      enum: [ACTIVE, HIDDEN]
    PracticeSessionStatus:
      type: string
      enum: [CREATED, UPLOADED, PROCESSING, SCORED, FAILED]

    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          description: >
            Mã lỗi nghiệp vụ, ví dụ UNAUTHORIZED, FORBIDDEN, NOT_FOUND, VALIDATION_ERROR, EMAIL_EXISTS,
            ACCOUNT_LOCKED, INVALID_TOKEN, SESSION_NOT_READY, SESSION_PROCESSING, DUPLICATE_QUESTION
          example: VALIDATION_ERROR
        message:
          type: string
          example: Dữ liệu không hợp lệ
        timestamp:
          type: string
          format: date-time
        fieldErrors:
          type: array
          description: Lỗi theo từng trường (chỉ có khi code = VALIDATION_ERROR)
          items:
            $ref: '#/components/schemas/FieldError'
    RegisterRequest:
      type: object
      required: [fullName, email, password, confirmPassword]
      properties:
        fullName:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        confirmPassword:
          type: string
          format: password

    RegisterResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

      example: {email: cand@example.com, password: Matkhau123}
    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
        expiresInHours:
          type: integer
          example: 24
        user:
          $ref: '#/components/schemas/User'

      example:
        accessToken: eyJhbGciOiJIUzI1NiJ9.xxx.yyy
        expiresInHours: 24
        user: {id: 3f6c1f0e-2a54-4a54-9b1e-0d5e2f7a9c11, fullName: Nguyễn Văn A, email: cand@example.com, role: CANDIDATE, status: ACTIVE}
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        status:
          $ref: '#/components/schemas/UserStatus'
        createdAt:
          type: string
          format: date-time

    Question:
      type: object
      properties:
        id:
          type: string
          format: uuid
        content:
          type: string
        industry:
          type: string
        position:
          type: string
        level:
          $ref: '#/components/schemas/QuestionLevel'
        questionType:
          $ref: '#/components/schemas/QuestionType'
        answerHint:
          type: string
          description: Gợi ý cách trả lời hiển thị cho người luyện tập (thay cho starHint cũ)
        status:
          $ref: '#/components/schemas/QuestionStatus'
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    QuestionUpsertRequest:
      type: object
      required: [content, industry, position, level, questionType]
      properties:
        content:
          type: string
        industry:
          type: string
        position:
          type: string
        level:
          $ref: '#/components/schemas/QuestionLevel'
        questionType:
          $ref: '#/components/schemas/QuestionType'
        answerHint:
          type: string
        referenceAnswer:
          type: string
          description: >
            Các ý chính cần có, dùng làm đáp án tham chiếu khi chấm câu TECHNICAL. Chỉ ADMIN gửi
            và xem; KHÔNG trả về cho người luyện tập.

    PracticeSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        questionId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/PracticeSessionStatus'
        audioUrl:
          type: string
          format: uri
          nullable: true
        duration:
          type: integer
          description: Thời lượng ghi âm (giây)
        totalScore:
          type: number
          format: float
          nullable: true
        feedback:
          type: string
          nullable: true
        startedAt:
          type: string
          format: date-time
        submittedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true

        errorCode:
          type: string
          nullable: true
          description: Mã lỗi khi status = FAILED (STT_ERROR, LLM_ERROR, INVALID_RESULT, ANSWER_TOO_SHORT, SERVER_RESTART)
    ScoreResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        transcript:
          type: string
        questionType:
          $ref: '#/components/schemas/QuestionType'
        totalScore:
          type: number
          format: float
          description: Điểm tổng 0-100, do server tính theo công thức trong Rubric_Cham_Diem.md
        contentScore:
          type: number
          format: float
          description: Điểm nội dung 0-100 (các tiêu chí do LLM chấm, không gồm Delivery)
        criteria:
          type: array
          description: Điểm từng tiêu chí của rubric theo questionType
          items:
            $ref: '#/components/schemas/CriterionScore'
        delivery:
          $ref: '#/components/schemas/DeliveryMetrics'
        offTopic:
          type: boolean
          description: Câu trả lời lạc đề; khi true, totalScore tối đa 30
        injectionSuspected:
          type: boolean
          description: Transcript có dấu hiệu yêu cầu thao túng điểm; hiển thị cảnh báo
        rubricVersion:
          type: string
        promptVersion:
          type: string
        modelVersion:
          type: string
        feedbackText:
          type: string
        sampleAnswer:
          type: string
          nullable: true
        ttsAudioUrl:
          type: string
          format: uri
          nullable: true
      example:
        id: 5b1f6a62-6c35-4e5e-8d6f-9d0a7f0d1c22
        sessionId: 7e0f1a30-4a4e-4c0b-b6d2-1a2b3c4d5e6f
        transcript: Trong dự án trước, nhóm tôi bị trễ tiến độ hai tuần ...
        questionType: BEHAVIORAL
        totalScore: 57.5
        contentScore: 55.6
        criteria:
          - {code: RELEVANCE, score: 4, weight: 20, reasoning: Trả lời đúng trọng tâm câu hỏi., quote: nhóm tôi bị trễ tiến độ hai tuần}
          - {code: STRUCTURE, score: 3, weight: 30, reasoning: Có tình huống và hành động, thiếu kết quả.: null, quote: tôi đề xuất chia lại công việc}
          - {code: DEPTH, score: 3, weight: 40, reasoning: Có ví dụ cụ thể nhưng thiếu số liệu., quote: giảm được ba ngày}
        delivery: {wpm: 128, fillerCount: 6, fillerRate: 4.1, deliveryScore: 4.0, fillerListVersion: filler-vi-v1}
        offTopic: false
        injectionSuspected: false
        rubricVersion: rubric-v1.0
        promptVersion: prompt-v1
        modelVersion: gemini-flash
        feedbackText: Bạn nên bổ sung kết quả đo được ở cuối câu trả lời.
    FieldError:
      type: object
      properties:
        field:
          type: string
          example: password
        message:
          type: string
          example: Mật khẩu tối thiểu 8 ký tự
    QuestionPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Question'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
    HistoryPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/PracticeSession'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
    ResetPasswordRequest:
      type: object
      required: [token, newPassword, confirmPassword]
      properties:
        token:
          type: string
          description: Token trong email đặt lại mật khẩu
        newPassword:
          type: string
          format: password
          minLength: 8
        confirmPassword:
          type: string
          format: password
    RescoreRequest:
      type: object
      required: [transcript]
      properties:
        transcript:
          type: string
          description: Transcript đã được người dùng sửa; tối thiểu 15 từ
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    CreateSessionRequest:
      type: object
      required: [questionId]
      properties:
        questionId:
          type: string
          format: uuid
    FeedbackAudioResponse:
      type: object
      properties:
        ttsAudioUrl:
          type: string
          format: uri
          description: URL ký sẵn có hạn tới audio TTS trên S3
    HistoryDetail:
      allOf:
        - $ref: '#/components/schemas/PracticeSession'
        - type: object
          properties:
            scoreResult:
              $ref: '#/components/schemas/ScoreResult'
    AnalyticsOverview:
      type: object
      description: Số liệu tổng quan trong khoảng thời gian [from, to] (UC9); không chứa thông tin nhạy cảm của người dùng (B2)
      properties:
        totalUsers:
          type: integer
        activeUsers:
          type: integer
          description: Số người dùng có ít nhất một phiên luyện tập trong khoảng
        totalSessions:
          type: integer
        scoredSessions:
          type: integer
        averageScore:
          type: number
          format: float
          nullable: true
        aiApiCalls:
          type: object
          properties:
            stt:
              type: integer
            llm:
              type: integer
            tts:
              type: integer
        estimatedCost:
          type: number
          format: float
          description: Tổng chi phí ước tính của các lượt gọi AI (từ api_usages)
    UserActivity:
      type: object
      description: Hoạt động luyện tập của một người dùng (UC9)
      properties:
        userId:
          type: string
          format: uuid
        fullName:
          type: string
        email:
          type: string
          format: email
        totalSessions:
          type: integer
        averageScore:
          type: number
          format: float
          nullable: true
        lastPracticeAt:
          type: string
          format: date-time
          nullable: true
        recentSessions:
          type: array
          items:
            $ref: '#/components/schemas/PracticeSession'
